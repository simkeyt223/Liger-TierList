<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LigerTiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f13;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: #232736;
    --accent: #e8b84b;
    --text: #e2e8f0;
    --muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; }

  /* NAV */
  nav {
    display: flex; align-items: center; gap: 2rem;
    padding: 0 2rem; height: 56px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
  .search-box {
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.8rem; margin-left: auto;
  }
  .search-box input { background: none; border: none; outline: none; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; width: 160px; }
  .search-box input::placeholder { color: var(--muted); }

  /* GAMEMODE TABS */
  .tabs {
    display: flex; gap: 0; background: var(--surface);
    border-bottom: 1px solid var(--border); padding: 0 1.5rem;
    overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.75rem 1.25rem; cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--muted); font-size: 0.9rem; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab svg { width: 22px; height: 22px; overflow: visible; }
  .tab-all svg { font-size: 18px; }

  /* MAIN */
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* STATS */
  .stats-bar { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.5rem; flex: 1; text-align: center; }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.3rem; }

  /* TABLE */
  .table-header {
    display: grid; grid-template-columns: 60px 1fr 100px 120px 160px 160px;
    padding: 0.5rem 1rem; font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    border-bottom: 1px solid var(--border); margin-bottom: 0.5rem;
  }
  .player-row {
    display: grid; grid-template-columns: 60px 1fr 100px 120px 160px 160px;
    align-items: center; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 6px; padding: 0.6rem 1rem;
    transition: border-color 0.2s, transform 0.15s;
    animation: fadeIn 0.4s ease both;
  }
  .player-row:hover { border-color: #3a3f52; transform: translateX(2px); }
  .player-row.rank-1 { border-left: 3px solid #f59e0b; }
  .player-row.rank-2 { border-left: 3px solid #9ca3af; }
  .player-row.rank-3 { border-left: 3px solid #cd7c2f; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .rank-num { font-size: 1.1rem; font-weight: 700; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .rank-num.gold { color: #f59e0b; }
  .rank-num.silver { color: #9ca3af; }
  .rank-num.bronze { color: #cd7c2f; }

  .player-info { display: flex; align-items: center; gap: 0.75rem; }
  .skin-wrap { width: 40px; height: 40px; border-radius: 4px; overflow: hidden; background: var(--surface2); flex-shrink: 0; }
  .skin-wrap img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .player-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
  .player-sub { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px; }

  .region-badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; font-family: 'IBM Plex Mono', monospace; }
  .region-NA { background: #1e3a5f; color: #60a5fa; }
  .region-EU { background: #1a3328; color: #34d399; }
  .region-AS { background: #3b1f4e; color: #c084fc; }
  .region-SA { background: #3d2012; color: #fb923c; }
  .region-AU { background: #1e3a1e; color: #86efac; }

  .tier-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; font-family: 'IBM Plex Mono', monospace; }
  .tier-HT1 { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
  .tier-HT2 { background: rgba(249,115,22,0.15); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }
  .tier-HT3 { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .tier-HT4 { background: rgba(220,38,38,0.15); color: #dc2626; border: 1px solid rgba(220,38,38,0.3); }
  .tier-HT5 { background: rgba(185,28,28,0.15); color: #b91c1c; border: 1px solid rgba(185,28,28,0.3); }
  .tier-LT1 { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
  .tier-LT2 { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
  .tier-LT3 { background: rgba(139,92,246,0.15); color: #8b5cf6; border: 1px solid rgba(139,92,246,0.3); }
  .tier-LT4 { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
  .tier-LT5 { background: rgba(75,85,99,0.15); color: #6b7280; border: 1px solid rgba(75,85,99,0.3); }

  .gm-badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .gm-badge svg { width: 14px; height: 14px; overflow: visible; }

  .result-date { font-size: 0.75rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text); }

  .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin: 2.5rem 0 1rem; display: flex; align-items: center; gap: 0.75rem; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .result-card { display: flex; align-items: center; gap: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 6px; animation: fadeIn 0.4s ease both; }
  .result-card .skin-wrap { width: 32px; height: 32px; }
  .result-info { flex: 1; }
  .result-name { font-size: 1rem; font-weight: 700; }
  .result-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .result-tiers { display: flex; gap: 0.4rem; align-items: center; }
  .arrow { color: var(--muted); }

  footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 3rem; }
</style>
</head>

const GM_SVGS = {
  Vanilla: VANILLA_SVG,
  Sword: SWORD_SVG,
  Mace: MACE_SVG
};

let allPlayers = [];
let allResults = [];
let currentTab = 'All';

function gmIcon(gm, size=16) {
  if (!GM_SVGS[gm]) return '';
  const vb = gm === 'Mace' ? '0 0 750 750' : '0 0 1080 1080';
  return `<svg viewBox="${vb}" width="${size}" height="${size}" style="overflow:visible;flex-shrink:0">${GM_SVGS[gm].replace(/^<svg[^>]*>/, '').replace('</svg>', '')}</svg>`;
}

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();
    allPlayers = data.players || [];
    allResults = data.results || [];
    render();
  } catch (e) {
    document.getElementById('playerList').innerHTML = '<div class="empty"><h2>No data yet</h2><p>Results will appear here once testers use /result in Discord.</p></div>';
  }
}

function tierRank(tier) {
  if (!tier) return 99;
  const order = { 'HT1':0,'HT2':1,'HT3':2,'HT4':3,'HT5':4,'LT1':5,'LT2':6,'LT3':7,'LT4':8,'LT5':9 };
  return order[tier.toUpperCase()] ?? 99;
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('searchInput').value = '';
  render();
}

function render() {
  const filtered = currentTab === 'All'
    ? allPlayers
    : allPlayers.filter(p => p.gamemode === currentTab);

  const sorted = [...filtered].sort((a, b) => tierRank(a.currentTier) - tierRank(b.currentTier));

  // Header — hide gamemode col when on a specific tab
  const showGm = currentTab === 'All';
  document.getElementById('tableHeader').innerHTML = showGm
    ? '<span>#</span><span>Player</span><span>Region</span><span>Gamemode</span><span>Current Tier</span><span>Last Tested</span>'
    : '<span>#</span><span>Player</span><span>Region</span><span></span><span>Current Tier</span><span>Last Tested</span>';

  // Stats
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${sorted.length}</div><div class="label">Ranked Players</div></div>
    <div class="stat-card"><div class="num">${allResults.filter(r => currentTab === 'All' || r.gamemode === currentTab).length}</div><div class="label">Total Tests</div></div>
    <div class="stat-card"><div class="num">${sorted.filter(p => p.currentTier?.toUpperCase().startsWith('HT')).length}</div><div class="label">High Tiers</div></div>
    <div class="stat-card"><div class="num">${[...new Set(sorted.map(p => p.region))].length}</div><div class="label">Regions</div></div>
  `;

  renderPlayers(sorted);

  // Recent results
  const recentResults = [...allResults]
    .filter(r => currentTab === 'All' || r.gamemode === currentTab)
    .reverse().slice(0, 10);

  const recentList = document.getElementById('recentList');
  if (recentResults.length === 0) {
    recentList.innerHTML = '<div style="color:var(--muted);font-size:0.9rem">No results yet.</div>';
  } else {
    recentList.innerHTML = recentResults.map(r => `
      <div class="result-card">
        <div class="skin-wrap"><img src="https://minotar.net/avatar/${r.username}/32" onerror="this.src='https://minotar.net/avatar/steve/32'" /></div>
        <div class="result-info">
          <div class="result-name">${r.username}</div>
          <div class="result-meta">
            ${gmIcon(r.gamemode, 13)} ${r.gamemode || ''} &nbsp;·&nbsp; ${r.region} &nbsp;·&nbsp; Tested by ${r.tester} &nbsp;·&nbsp; ${formatDate(r.date)}
          </div>
        </div>
        <div class="result-tiers">
          <span class="tier-badge tier-${r.previousRank?.toUpperCase()}">${r.previousRank || '—'}</span>
          <span class="arrow">→</span>
          <span class="tier-badge tier-${r.rankEarned?.toUpperCase()}">${r.rankEarned}</span>
        </div>
      </div>
    `).join('');
  }
}

function renderPlayers(players) {
  const list = document.getElementById('playerList');
  const showGm = currentTab === 'All';
  if (players.length === 0) {
    list.innerHTML = '<div class="empty"><h2>No players found</h2><p>Results will appear here automatically.</p></div>';
    return;
  }
  list.innerHTML = players.map((p, i) => {
    const rc = i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const rr = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    return `
      <div class="player-row ${rr}" style="animation-delay:${i*0.04}s">
        <div class="rank-num ${rc}">${i+1}.</div>
        <div class="player-info">
          <div class="skin-wrap"><img src="https://minotar.net/avatar/${p.username}/40" onerror="this.src='https://minotar.net/avatar/steve/40'"/></div>
          <div>
            <div class="player-name">${p.username}</div>
            <div class="player-sub">${p.discordTag || ''}</div>
          </div>
        </div>
        <div><span class="region-badge region-${p.region}">${p.region}</span></div>
        <div>${showGm ? `<span class="gm-badge">${gmIcon(p.gamemode, 14)} ${p.gamemode||''}</span>` : ''}</div>
        <div><span class="tier-badge tier-${p.currentTier?.toUpperCase()}">${p.currentTier}</span></div>
        <div class="result-date">${formatDate(p.lastTested)}</div>
      </div>
    `;
  }).join('');
}

function filterPlayers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const base = currentTab === 'All' ? allPlayers : allPlayers.filter(p => p.gamemode === currentTab);
  const filtered = base.filter(p => p.username.toLowerCase().includes(q));
  const sorted = [...filtered].sort((a, b) => tierRank(a.currentTier) - tierRank(b.currentTier));
  renderPlayers(sorted);
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>

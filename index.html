<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PvP Tiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f13;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: #232736;
    --accent: #e8b84b;
    --accent2: #4b8be8;
    --text: #e2e8f0;
    --muted: #6b7280;
    --ht1: #f59e0b;
    --ht2: #f97316;
    --ht3: #ef4444;
    --lt1: #10b981;
    --lt2: #3b82f6;
    --lt3: #8b5cf6;
    --lt4: #6b7280;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    gap: 2rem;
    padding: 0 2rem;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-logo {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
    margin-left: auto;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--text); }

  .search-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.8rem;
  }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    width: 160px;
  }

  .search-box input::placeholder { color: var(--muted); }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    flex: 1;
    text-align: center;
  }

  .stat-card .num {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-card .label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.3rem;
  }

  /* TABLE HEADER */
  .table-header {
    display: grid;
    grid-template-columns: 60px 1fr 100px 180px 200px;
    padding: 0.5rem 1rem;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }

  /* PLAYER ROW */
  .player-row {
    display: grid;
    grid-template-columns: 60px 1fr 100px 180px 200px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    padding: 0.6rem 1rem;
    transition: border-color 0.2s, transform 0.15s;
    animation: fadeIn 0.4s ease both;
  }

  .player-row:hover {
    border-color: #3a3f52;
    transform: translateX(2px);
  }

  .player-row.rank-1 { border-left: 3px solid #f59e0b; }
  .player-row.rank-2 { border-left: 3px solid #9ca3af; }
  .player-row.rank-3 { border-left: 3px solid #cd7c2f; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .rank-num {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .rank-num.gold { color: #f59e0b; }
  .rank-num.silver { color: #9ca3af; }
  .rank-num.bronze { color: #cd7c2f; }

  .player-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .skin-wrap {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface2);
    flex-shrink: 0;
  }

  .skin-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }

  .player-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .player-rank-label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 1px;
  }

  /* REGION */
  .region-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    font-family: 'IBM Plex Mono', monospace;
  }

  .region-NA { background: #1e3a5f; color: #60a5fa; }
  .region-EU { background: #1a3328; color: #34d399; }
  .region-AS { background: #3b1f4e; color: #c084fc; }
  .region-SA { background: #3d2012; color: #fb923c; }
  .region-AU { background: #1e3a1e; color: #86efac; }

  /* TIER BADGE */
  .tier-badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-family: 'IBM Plex Mono', monospace;
  }

  .tier-HT1 { background: rgba(245,158,11,0.15); color: var(--ht1); border: 1px solid rgba(245,158,11,0.3); }
  .tier-HT2 { background: rgba(249,115,22,0.15); color: var(--ht2); border: 1px solid rgba(249,115,22,0.3); }
  .tier-HT3 { background: rgba(239,68,68,0.15); color: var(--ht3); border: 1px solid rgba(239,68,68,0.3); }
  .tier-LT1 { background: rgba(16,185,129,0.15); color: var(--lt1); border: 1px solid rgba(16,185,129,0.3); }
  .tier-LT2 { background: rgba(59,130,246,0.15); color: var(--lt2); border: 1px solid rgba(59,130,246,0.3); }
  .tier-LT3 { background: rgba(139,92,246,0.15); color: var(--lt3); border: 1px solid rgba(139,92,246,0.3); }
  .tier-LT4 { background: rgba(107,114,128,0.15); color: var(--lt4); border: 1px solid rgba(107,114,128,0.3); }

  /* RESULTS / DATE */
  .result-date {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }

  .empty h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text); }

  /* RECENT RESULTS SECTION */
  .section-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin: 2.5rem 0 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .result-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 6px;
    animation: fadeIn 0.4s ease both;
  }

  .result-card .skin-wrap { width: 32px; height: 32px; }

  .result-info { flex: 1; }
  .result-name { font-size: 1rem; font-weight: 700; }
  .result-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

  .result-tiers { display: flex; gap: 0.4rem; align-items: center; }
  .arrow { color: var(--muted); font-size: 1rem; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 3rem;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">⚔ PvP Tiers</div>
  <ul class="nav-links">
    <li><a href="#rankings">Rankings</a></li>
    <li><a href="#results">Recent Results</a></li>
  </ul>
  <div class="search-box">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:#6b7280"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search player..." oninput="filterPlayers()" />
  </div>
</nav>

<main>
  <div class="stats-bar" id="statsBar"></div>

  <div id="rankings">
    <div class="table-header">
      <span>#</span>
      <span>Player</span>
      <span>Region</span>
      <span>Current Tier</span>
      <span>Last Tested</span>
    </div>
    <div id="playerList"></div>
  </div>

  <div id="recentSection">
    <div class="section-title">Recent Results</div>
    <div id="recentList"></div>
  </div>
</main>

<footer>PvP Tiers — Updated automatically via Discord bot</footer>

<script>
let allPlayers = [];

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('playerList').innerHTML = '<div class="empty"><h2>No data yet</h2><p>Results will appear here once testers start using /result in Discord.</p></div>';
  }
}

function tierRank(tier) {
  if (!tier) return 99;
  const t = tier.toUpperCase();
  const order = {
    'HT1': 0, 'HT2': 1, 'HT3': 2, 'HT4': 3, 'HT5': 4,
    'LT1': 5, 'LT2': 6, 'LT3': 7, 'LT4': 8, 'LT5': 9
  };
  return order[t] ?? 99;
}

function render(data) {
  const players = data.players || [];
  const results = data.results || [];

  allPlayers = players.sort((a, b) => tierRank(a.currentTier) - tierRank(b.currentTier));

  // Stats
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${players.length}</div><div class="label">Ranked Players</div></div>
    <div class="stat-card"><div class="num">${results.length}</div><div class="label">Total Tests</div></div>
    <div class="stat-card"><div class="num">${players.filter(p => p.currentTier?.startsWith('HT')).length}</div><div class="label">High Tiers</div></div>
    <div class="stat-card"><div class="num">${[...new Set(players.map(p => p.region))].length || 0}</div><div class="label">Regions</div></div>
  `;

  renderPlayers(allPlayers);

  // Recent results
  const recent = [...results].reverse().slice(0, 10);
  const recentList = document.getElementById('recentList');
  if (recent.length === 0) {
    recentList.innerHTML = '<div style="color:var(--muted);font-size:0.9rem">No results yet.</div>';
  } else {
    recentList.innerHTML = recent.map(r => `
      <div class="result-card">
        <div class="skin-wrap"><img src="https://minotar.net/avatar/${r.username}/32" alt="${r.username}" onerror="this.src='https://minotar.net/avatar/steve/32'"/></div>
        <div class="result-info">
          <div class="result-name">${r.username}</div>
          <div class="result-meta">Tested by ${r.tester} · ${r.region} · ${formatDate(r.date)}</div>
        </div>
        <div class="result-tiers">
          <span class="tier-badge tier-${r.previousRank}">${r.previousRank || '—'}</span>
          <span class="arrow">→</span>
          <span class="tier-badge tier-${r.rankEarned}">${r.rankEarned}</span>
        </div>
      </div>
    `).join('');
  }
}

function renderPlayers(players) {
  const list = document.getElementById('playerList');
  if (players.length === 0) {
    list.innerHTML = '<div class="empty"><h2>No players found</h2><p>Results will appear here automatically.</p></div>';
    return;
  }
  list.innerHTML = players.map((p, i) => {
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const rowClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    return `
      <div class="player-row ${rowClass}" style="animation-delay:${i * 0.04}s">
        <div class="rank-num ${rankClass}">${i + 1}.</div>
        <div class="player-info">
          <div class="skin-wrap"><img src="https://minotar.net/avatar/${p.username}/40" alt="${p.username}" onerror="this.src='https://minotar.net/avatar/steve/40'"/></div>
          <div>
            <div class="player-name">${p.username}</div>
            <div class="player-rank-label">${p.discordTag || ''}</div>
          </div>
        </div>
        <div><span class="region-badge region-${p.region}">${p.region}</span></div>
        <div><span class="tier-badge tier-${p.currentTier}">${p.currentTier}</span></div>
        <div class="result-date">${formatDate(p.lastTested)}</div>
      </div>
    `;
  }).join('');
}

function filterPlayers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allPlayers.filter(p => p.username.toLowerCase().includes(q));
  renderPlayers(filtered);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

loadData();
setInterval(loadData, 60000); // refresh every minute
</script>
</body>
</html>

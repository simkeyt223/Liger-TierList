<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LigerSMP — PvP Rankings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0e12;
            --surface: #13151c;
            --surface-hover: #1e2230;
            --border: #252a3a;
            --accent: #FF4D6D; 
            --text-main: #ffffff;
            --text-muted: #7a8499;
            --radius: 12px;
            --transition: 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 77, 109, 0.4);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input, select {
            background-color: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 1rem 1.2rem;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input {
            flex: 1;
            min-width: 260px;
        }

        select {
            min-width: 200px;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
        }

        #players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .player-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .player-card:hover {
            transform: translateY(-5px);
            background-color: var(--surface-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            background-color: var(--border);
            image-rendering: pixelated;
            border: 2px solid var(--border);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
        }

        .username {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .tier-badge {
            display: inline-block;
            background-color: rgba(255, 77, 109, 0.1);
            color: var(--accent);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
            border: 1px solid rgba(255, 77, 109, 0.3);
        }

        .gamemode-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        #status-msg {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 3rem;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            body { padding: 1rem; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <h1>LigerSMP</h1>
        <p class="subtitle">PvP Tier List & Rankings</p>
    </header>

    <div class="controls">
        <input type="text" id="search-input" placeholder="Search player name..." />
        <select id="gamemode-filter">
            <option value="All">All Gamemodes</option>
            <option value="Vanilla">Vanilla</option>
            <option value="Diamond Vanilla">Diamond Vanilla</option>
            <option value="NDBP Vanilla">NDBP Vanilla</option>
            <option value="Sword">Sword</option>
            <option value="Speed">Speed</option>
            <option value="Mace">Mace</option>
            <option value="Spear Mace">Spear Mace</option>
            <option value="Neth Pot">Neth Pot</option>
            <option value="Neth OP">Neth OP</option>
            <option value="SMP">SMP</option>
            <option value="Diamond SMP">Diamond SMP</option>
        </select>
    </div>

    <div id="status-msg">Loading rankings...</div>
    <div id="players-grid"></div>

    <script>
        /* ─── CONFIGURATION ─── */
        const GITHUB_OWNER = "YOUR_GITHUB_USERNAME"; 
        const GITHUB_REPO  = "YOUR_REPO_NAME";
        /* ───────────────────── */

        const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/data.json`;
        
        let globalPlayers = [];
        const grid = document.getElementById('players-grid');
        const statusMsg = document.getElementById('status-msg');
        const searchInput = document.getElementById('search-input');
        const gamemodeFilter = document.getElementById('gamemode-filter');

        async function fetchData() {
            try {
                const res = await fetch(`${API_URL}?nocache=${new Date().getTime()}`);
                if (!res.ok) throw new Error(`Fetch error: ${res.status}`);
                
                const json = await res.json();
                const content = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\s/g, '')))));
                
                globalPlayers = content.players || [];
                
                if (globalPlayers.length === 0) {
                    statusMsg.innerText = "The tier list is currently empty.";
                } else {
                    statusMsg.style.display = 'none';
                    render();
                }
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "Error loading data. Ensure your repository settings are correct.";
                statusMsg.style.color = "#FF4D6D";
            }
        }

        function render() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedGM = gamemodeFilter.value;

            const filtered = globalPlayers.filter(p => {
                const nameMatch = p.username.toLowerCase().includes(searchTerm);
                const gmMatch = (selectedGM === "All" || p.gamemode === selectedGM);
                return nameMatch && gmMatch;
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1; text-align:center; padding: 2rem;">No results found.</div>';
                return;
            }

            filtered.sort((a, b) => a.username.localeCompare(b.username));

            filtered.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                const headUrl = `https://minotar.net/helm/${player.username}/100.png`;

                card.innerHTML = `
                    <img src="${headUrl}" class="avatar" loading="lazy" onerror="this.src='https://minotar.net/helm/MHF_Steve/100.png'">
                    <div class="player-info">
                        <div class="username">${player.username}</div>
                        <div class="gamemode-label"><span>🎮</span> ${player.gamemode}</div>
                        <div class="tier-badge">${player.currentTier}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', render);
        gamemodeFilter.addEventListener('change', render);
        fetchData();
    </script>
</body>
</html>
